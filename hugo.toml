[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON 給站內搜尋用

[params]
  env = "production"
  author = "張紘誌"
  description = "Computer Science student · Computer Vision · AI/ML"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

  [params.homeInfoParams]
    Title = "Hi, I'm 紘誌 👋"
    Content = "資工系學生，專注於電腦視覺與 AI 系統。這裡記錄我的研究、專案與技術筆記。"


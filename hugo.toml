    url = "https://scholar.google.com/"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/yourname"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:jason0930.chang@gmail.com"

